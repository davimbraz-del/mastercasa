<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Meus favoritos - Mastercasa Imobiliária</title>
	<meta name="robots" content="noindex, nofollow">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin-body">

	<div class="admin-topbar">
		<div class="container admin-topbar-inner">
			<div class="admin-topbar-brand">
				MASTERCASA <span>Minha conta</span>
			</div>
			<div class="admin-topbar-user">
				<span id="nomeUsuario"></span>
				<button type="button" id="botaoSair" class="btn btn-outline-light btn-small">Sair</button>
			</div>
		</div>
	</div>

	<main class="admin-main">
		<div class="container">
			<div class="admin-card">
				<div class="admin-card-head">
					<h1>Meus imóveis favoritos</h1>
					<a href="../index.html#imoveis" class="btn btn-outline">Ver todos os imóveis</a>
				</div>

				<div class="property-grid" id="favoritosGrid"></div>

				<p class="admin-empty" id="favoritosVazio" hidden>Você ainda não favoritou nenhum imóvel. Volte ao site e clique no coração dos imóveis que você gostar.</p>
			</div>
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
	<script src="../js/supabase-config.js"></script>
	<script src="../js/supabase-client.js"></script>
	<script src="../js/cliente-auth.js"></script>
	<script src="../js/cliente-favoritos.js"></script>
</body>
</html>
